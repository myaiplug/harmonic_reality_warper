[package]
name = "nodaw-flac-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Thin wasm-bindgen wrapper around wavey-ai/flac (wavey-flac) for browser FLAC export"

[lib]
crate-type = ["cdylib"]

[dependencies]
wavey-flac = { path = "../flac", default-features = false }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
